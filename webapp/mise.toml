[tools]
node = "lts"

[tasks.dev]
description = "Start dev server"
run = "pnpm run dev"

[tasks.check]
description = "Check Svelte and TypeScript"
run = "pnpm run check"

[tasks.lint]
description = "Lint the web app"
run = "pnpm run lint"

[tasks."format:check"]
description = "Check web app formatting"
run = "pnpm run format:check"

[tasks.format]
description = "Format the web app"
run = "pnpm run format"

[tasks.test]
description = "Run unit and browser tests"
run = "pnpm test"

[tasks.verify]
description = "Verify the web app"
depends = ["check", "lint", "format:check", "test"]
