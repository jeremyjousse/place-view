name: Deploy website

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy_places.yml"
      - "resources/places.json"
      - "webapp/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: webapp/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml
      - uses: actions/configure-pages@v6
      - name: Install dependencies
        run: pnpm --dir webapp install --frozen-lockfile
      - name: Build website
        run: pnpm --dir webapp build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: webapp/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
