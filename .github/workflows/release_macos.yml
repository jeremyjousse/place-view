name: Build and Release macOS App

on:
  push:
    branches:
      - main
    paths:
      - 'tauri-app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get App Version
        id: get_version
        run: |
          VERSION=$(jq -r '.version' tauri-app/src-tauri/tauri.conf.json)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and Release macOS App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri-app
          tauriScript: pnpm tauri
          tagName: v${{ steps.get_version.outputs.version }}
          releaseName: Release v${{ steps.get_version.outputs.version }}
          releaseBody: |
            Automated release from main branch.

            **Note:** This app is not signed with an Apple Developer Certificate.
            To run it, you may need to:
            1. Unzip the app.
            2. Right-click and select "Open" (to bypass Gatekeeper).
            3. If that doesn't work, run `xattr -cr /path/to/place-view.app` in terminal.
          releaseDraft: false
          prerelease: false
